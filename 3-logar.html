<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HandGO - Login</title>
    <style>
        :root {
            --primary: #6a0dad;
            --primary-dark: #4b0082;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f5f3ff;
            --white: #ffffff;
            --shadow: 0 20px 45px rgba(76, 29, 149, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #e9d5ff 100%);
            color: var(--text);
        }

        a { text-decoration: none; }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(106,13,173,0.08);
        }

        .container {
            width: min(1200px, 100%);
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 72px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-weight: 800;
            font-size: 1.7rem;
        }

        .logo-mark {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: white;
            font-size: 1rem;
        }

        .btn-link {
            border: 1px solid rgba(106,13,173,0.2);
            background: rgba(106,13,173,0.04);
            color: var(--primary);
            font-weight: 700;
            border-radius: 999px;
            padding: 10px 18px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-link:hover {
            background: rgba(106,13,173,0.1);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 32px 28px;
            margin-top: 90px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 2.5rem);
            color: var(--primary-dark);
        }

        .subtitle {
            margin: 0 0 24px;
            font-size: 0.96rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 1rem;
            background: #fff;
            transition: 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(106,13,173,0.12);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            margin-bottom: 22px;
            font-size: 0.92rem;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px rgba(109,40,217,0.22);
        }

        .helper {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .helper a {
            color: var(--primary);
            font-weight: 700;
        }

        .status {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .nav {
                justify-content: center;
                gap: 12px;
                flex-direction: column;
                padding: 14px 0;
            }

            .card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container">
            <nav class="nav">
                <a href="1%20site%20.html" class="logo" aria-label="Voltar para a página inicial">
                    <span class="logo-mark">✋</span>
                    <span>HandGO</span>
                </a>
                <button type="button" class="btn-link" onclick="window.location.href='2%20cadrastro.html'">Criar conta</button>
            </nav>
        </div>
    </header>

    <main class="card" aria-labelledby="titulo-login">
        <h1 id="titulo-login">Entrar</h1>
        <p class="subtitle">Acesse sua conta para continuar contratando ou oferecendo serviços.</p>

        <div id="statusMessage" class="status" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seuemail@exemplo.com" required />
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <input id="password" type="password" placeholder="Digite sua senha" required />
            </div>

            <label class="remember" for="rememberMe">
                <input id="rememberMe" type="checkbox" />
                <span>Lembrar de mim</span>
            </label>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <p class="helper">Ainda não tem conta? <a href="2%20cadrastro.html">Cadastre-se</a></p>
    </main>

    <script>
        (function () {
            const loginForm = document.getElementById('loginForm');
            const statusMessage = document.getElementById('statusMessage');

            try {
                if (localStorage.getItem('temConta') === 'true') {
                    window.location.href = '1%20site%20.html';
                }
            } catch (error) {
                console.warn('Não foi possível verificar sessão local.', error);
            }

            function showStatus(message, isError = true) {
                statusMessage.textContent = message;
                statusMessage.style.display = 'block';
                statusMessage.style.background = isError ? '#fee2e2' : '#ecfdf5';
                statusMessage.style.borderColor = isError ? '#fca5a5' : '#6ee7b7';
                statusMessage.style.color = isError ? '#991b1b' : '#166534';
            }

            loginForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const remember = document.getElementById('rememberMe').checked;

                if (!email || !password) {
                    showStatus('Preencha seu e-mail e senha para continuar.', true);
                    return;
                }

                if (password.length < 6) {
                    showStatus('A senha deve ter pelo menos 6 caracteres.', true);
                    return;
                }

                try {
                    localStorage.setItem('temConta', 'true');
                    localStorage.setItem('loggedIn', '1');
                    localStorage.setItem('userEmail', email);
                    if (remember) {
                        localStorage.setItem('rememberMe', 'true');
                    } else {
                        localStorage.removeItem('rememberMe');
                    }
                    showStatus('Login realizado com sucesso! Redirecionando...', false);
                    setTimeout(function () {
                        window.location.href = '1%20site%20.html';
                    }, 800);
                } catch (error) {
                    showStatus('Não foi possível fazer login agora. Tente novamente.', true);
                }
            });
        })();
    </script>
</body>
</html>
