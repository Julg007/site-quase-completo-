<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandGO - Meu Perfil</title>
  <style>
    :root {
      --primary: #6a0dad;
      --primary-dark: #4b0082;
      --text: #1f2937;
      --muted: #6b7280;
      --bg: #f5f3ff;
      --card: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 18px 44px rgba(76, 29, 149, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
      color: var(--text);
    }

    .container {
      max-width: 860px;
      margin: 40px auto;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: white;
      padding: 36px 30px 28px;
      text-align: center;
    }

    .avatar {
      width: 114px;
      height: 114px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 18px;
      font-weight: 800;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.5rem);
    }

    .subtitle {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 1rem;
    }

    .content {
      padding: 28px 30px 36px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .card-box h2 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 1.1rem;
    }

    .card-box p, .card-box li {
      margin: 0;
      color: var(--text);
      line-height: 1.7;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .tag {
      background: #ede9fe;
      color: var(--primary);
      border: 1px solid rgba(106,13,173,0.12);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: white;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px 12px;
      }

      .content {
        padding: 20px 18px 24px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="avatar" id="avatarLetter">U</div>
      <h1 id="profileName">Seu Nome</h1>
      <p class="subtitle" id="profileType">Cliente · Perfil ativo</p>
    </header>

    <section class="content">
      <div class="grid">
        <article class="card-box">
          <h2>Sobre</h2>
          <p id="aboutText">Perfil em formação. Aqui você pode manter seus dados, preferências e histórico de serviços.</p>
        </article>

        <article class="card-box">
          <h2>Contato</h2>
          <p id="profileEmail">Email: seuemail@exemplo.com</p>
          <p id="profilePhone">Telefone: (00) 00000-0000</p>
          <p id="profileCity">Localização: Sua cidade</p>
        </article>
      </div>

      <div class="card-box" style="margin-top: 20px;">
        <h2>Especialidades</h2>
        <div class="tags">
          <span class="tag">Serviços</span>
          <span class="tag">Atendimento</span>
          <span class="tag">Agendamento</span>
          <span class="tag">Segurança</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" onclick="window.location.href='1%20site%20.html'">Voltar ao site</button>
        <button type="button" class="btn btn-secondary" id="logoutButton">Sair</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const profileName = document.getElementById('profileName');
      const profileType = document.getElementById('profileType');
      const profileEmail = document.getElementById('profileEmail');
      const profilePhone = document.getElementById('profilePhone');
      const profileCity = document.getElementById('profileCity');
      const avatarLetter = document.getElementById('avatarLetter');
      const logoutButton = document.getElementById('logoutButton');

      function readValue(key, fallback) {
        try {
          return localStorage.getItem(key) || fallback;
        } catch (error) {
          return fallback;
        }
      }

      const name = readValue('profileName', 'Seu Nome');
      const type = readValue('profileType', 'cliente');
      const email = readValue('userEmail', 'seuemail@exemplo.com');
      const phone = readValue('profilePhone', '(00) 00000-0000');
      const city = readValue('profileCity', 'Sua cidade');

      const labelType = type === 'profissional' ? 'Profissional · Perfil ativo' : 'Cliente · Perfil ativo';
      profileName.textContent = name;
      profileType.textContent = labelType;
      profileEmail.textContent = 'Email: ' + email;
      profilePhone.textContent = 'Telefone: ' + phone;
      profileCity.textContent = 'Localização: ' + city;
      avatarLetter.textContent = (name || 'U').trim().charAt(0).toUpperCase();

      logoutButton.addEventListener('click', function () {
        localStorage.removeItem('loggedIn');
        localStorage.removeItem('temConta');
        localStorage.removeItem('userEmail');
        window.location.href = '1%20site%20.html';
      });
    })();
  </script>
</body>
</html>
